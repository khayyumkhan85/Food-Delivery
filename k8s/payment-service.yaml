apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-service, namespace: food-delivery}
spec:
  replicas: 2
  selector: {matchLabels: {app: payment-service}}
  template:
    metadata: {labels: {app: payment-service}}
    spec:
      containers:
      - name: payment-service
        image: fooddelivery/payment-service:1.0.0
        ports: [{containerPort: 8084}]
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: http://discovery-server:8761/eureka/
---
apiVersion: v1
kind: Service
metadata: {name: payment-service, namespace: food-delivery}
spec:
  selector: {app: payment-service}
  ports: [{port: 8084, targetPort: 8084}]
