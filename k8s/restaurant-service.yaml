apiVersion: apps/v1
kind: Deployment
metadata: {name: restaurant-service, namespace: food-delivery}
spec:
  replicas: 2
  selector: {matchLabels: {app: restaurant-service}}
  template:
    metadata: {labels: {app: restaurant-service}}
    spec:
      containers:
      - name: restaurant-service
        image: fooddelivery/restaurant-service:1.0.0
        ports: [{containerPort: 8082}]
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: http://discovery-server:8761/eureka/
---
apiVersion: v1
kind: Service
metadata: {name: restaurant-service, namespace: food-delivery}
spec:
  selector: {app: restaurant-service}
  ports: [{port: 8082, targetPort: 8082}]
