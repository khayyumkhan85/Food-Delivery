apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service, namespace: food-delivery}
spec:
  replicas: 2
  selector: {matchLabels: {app: order-service}}
  template:
    metadata: {labels: {app: order-service}}
    spec:
      containers:
      - name: order-service
        image: fooddelivery/order-service:1.0.0
        ports: [{containerPort: 8083}]
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: http://discovery-server:8761/eureka/
---
apiVersion: v1
kind: Service
metadata: {name: order-service, namespace: food-delivery}
spec:
  selector: {app: order-service}
  ports: [{port: 8083, targetPort: 8083}]
