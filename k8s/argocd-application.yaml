apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: food-delivery, namespace: argocd}
spec:
  project: default
  source: {repoURL: https://github.com/your-org/food-delivery.git, targetRevision: main, path: k8s}
  destination: {server: https://kubernetes.default.svc, namespace: food-delivery}
  syncPolicy: {automated: {prune: true, selfHeal: true}}
