<!doctype html><html lang="en" ng-app="foodDelivery"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Delivery</title><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script><style>body{font-family:Arial;margin:0;background:#f6f6f6;color:#222}.bar{padding:18px 8%;background:#222;color:white}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:white;padding:20px;margin:15px 0;border-radius:8px;box-shadow:0 2px 8px #ddd}button{padding:9px 14px;border:0;border-radius:5px;background:#222;color:#fff;cursor:pointer}input{padding:9px;margin:5px;width:220px}.menu{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding:12px 0}</style></head><body ng-controller="AppController"><div class="bar"><h2>Food Delivery</h2></div><div class="wrap"><div class="card"><h3>Restaurants</h3><button ng-click="loadRestaurants()">Refresh</button><div ng-repeat="r in restaurants"><h3>{{r.name}} <small>({{r.cuisine}})</small></h3><p>{{r.address}}</p><div class="menu" ng-repeat="m in r.menu"><span>{{m.name}} - ${{m.price}}</span><button ng-click="add(r,m)">Add</button></div></div></div><div class="card"><h3>Checkout</h3><input ng-model="userId" placeholder="User ID"><p ng-repeat="x in cart">{{x.name}} x {{x.quantity}} = ${{x.price*x.quantity}}</p><strong>Total: ${{total()}}</strong><br><br><button ng-click="checkout()">Place Order</button><p>{{message}}</p></div></div><script>angular.module('foodDelivery',[]).controller('AppController',function($scope,$http){$scope.restaurants=[];$scope.cart=[];$scope.userId=1;$scope.loadRestaurants=function(){$http.get('http://localhost:8080/restaurant-service/api/restaurants').then(function(r){$scope.restaurants=r.data},function(){ $scope.message='Start the backend services first.';});};$scope.add=function(r,m){var x=$scope.cart.find(function(i){return i.itemId===m.id});if(x)x.quantity++;else $scope.cart.push({itemId:m.id,name:m.name,price:m.price,quantity:1,restaurantId:r.id});};$scope.total=function(){return $scope.cart.reduce(function(s,x){return s+x.price*x.quantity},0).toFixed(2)};$scope.checkout=function(){if(!$scope.cart.length)return;$http.post('http://localhost:8080/order-service/api/orders',{userId:$scope.userId,restaurantId:$scope.cart[0].restaurantId,items:$scope.cart,totalAmount:Number($scope.total())}).then(function(r){$scope.message='Order #'+r.data.id+' '+r.data.status;$scope.cart=[]},function(){ $scope.message='Order failed.';});};$scope.loadRestaurants();});</script></body></html>
