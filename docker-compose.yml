version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: food_delivery}
    ports: ["3306:3306"]
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
  discovery-server:
    build: {context: ., dockerfile: discovery-server/Dockerfile}
    ports: ["8761:8761"]
  gateway-service:
    build: {context: ., dockerfile: gateway-service/Dockerfile}
    ports: ["8080:8080"]
    depends_on: [discovery-server]
  user-service:
    build: {context: ., dockerfile: user-service/Dockerfile}
    ports: ["8081:8081"]
    depends_on: [mysql, discovery-server]
  restaurant-service:
    build: {context: ., dockerfile: restaurant-service/Dockerfile}
    ports: ["8082:8082"]
    depends_on: [mongodb, discovery-server]
  payment-service:
    build: {context: ., dockerfile: payment-service/Dockerfile}
    ports: ["8084:8084"]
    depends_on: [mysql, discovery-server]
  order-service:
    build: {context: ., dockerfile: order-service/Dockerfile}
    ports: ["8083:8083"]
    depends_on: [mysql, discovery-server, restaurant-service, payment-service]
